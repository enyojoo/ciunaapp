<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciuna design system</title>
<link rel="icon" href="assets/logos/ciuna-mark.svg">
<link rel="stylesheet" href="components/tokens.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font-web);background:var(--paper);color:var(--ink);display:flex;-webkit-font-smoothing:antialiased}
aside{width:272px;flex-shrink:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--hairline);padding:18px 12px 40px}
aside .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
aside .logo img{height:22px}
aside .logo span{font:600 12px/1 var(--font-web);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
aside input{width:100%;height:38px;border:1px solid var(--input-edge);border-radius:10px;padding:0 12px;font:400 14px var(--font-web);margin:4px 0 10px}
.grp{font:600 11px/16px var(--font-web);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font:500 14px/20px var(--font-web);color:var(--ink);text-decoration:none;cursor:pointer}
.lnk:hover{background:var(--neutral-surface)}.lnk.on{background:var(--primary-tint);color:var(--primary-text);font-weight:600}
.lnk small{color:var(--muted);font-size:12px}
main{flex:1;min-width:0;height:100vh;overflow:auto;padding:32px 40px 80px}
h1{font:700 30px/36px var(--font-web);letter-spacing:-.5px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 28px;max-width:720px}
.cardwrap{margin:0 0 36px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:10px}
.cardhead h2{font:600 17px/24px var(--font-web);margin:0}
.cardhead p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:760px}
.cardhead a{font:500 13px var(--font-web);color:var(--primary-text);margin-left:12px;white-space:nowrap}
iframe{display:block;width:100%;border:1px solid var(--hairline);border-radius:16px;background:var(--paper)}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:0 0 32px}
.tile{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);display:block}
.tile b{display:block;font:600 16px/22px var(--font-web)}.tile span{color:var(--muted);font-size:13px}
.log{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:6px 18px}
.log div{padding:12px 0;border-bottom:1px solid var(--hairline)}.log div:last-child{border:0}
.log b{font-weight:600}.log span{display:block;color:var(--muted);font-size:14px}
@media(max-width:800px){aside{display:none}main{padding:20px}}
</style></head>
<body>
<aside><div class="logo"><img src="assets/logos/ciuna.svg" alt="Ciuna"><span>Design system</span></div><input id="q" placeholder="Search components and screens" aria-label="Search"><nav id="nav"></nav></aside>
<main id="main"></main>
<script>
var DATA, LOG;
Promise.all([fetch("cards.json").then(function(r){return r.json()}), fetch("changelog.json").then(function(r){return r.json()})]).then(function(r){DATA=r[0];LOG=r[1];nav();route();});
var $=function(s){return document.querySelector(s)};
function nav(){
  var q=($("#q").value||"").toLowerCase(), h="";
  h+='<a class="lnk'+(location.hash===""||location.hash==="#home"?" on":"")+'" href="#home">Home</a>';
  DATA.groups.forEach(function(g){
    var cs=DATA.cards.filter(function(c){return c.group===g&&(!q||(c.name+" "+c.subtitle).toLowerCase().indexOf(q)>=0)});
    if(!cs.length) return;
    h+='<div class="grp">'+g+'</div>';
    cs.forEach(function(c){h+='<a class="lnk'+(location.hash==="#"+c.name?" on":"")+'" href="#'+c.name+'">'+c.name+'</a>'});
  });
  $("#nav").innerHTML=h;
}
function card(c){
  var w=c.width?c.width+"px":"100%";
  return '<section class="cardwrap" id="c-'+c.name+'"><div class="cardhead"><div><h2>'+c.name+'</h2><p>'+c.subtitle+'</p></div><div style="white-space:nowrap"><a href="components/'+c.name+'/preview.html" target="_blank">Open</a>'+(c.readme?'<a href="components/'+c.name+'/README.md" target="_blank">Spec</a>':'')+'</div></div><iframe loading="lazy" src="components/'+c.name+'/preview.html" style="height:'+c.height+'px;max-width:100%;width:'+w+'" title="'+c.name+'"></iframe></section>';
}
function route(){
  nav();var hash=location.hash.slice(1), m=$("#main"), h="";
  if(!hash||hash==="home"){
    h+='<h1>Ciuna design system</h1><p class="sub">One system for the customer app, Ciuna Seller and Office. Orange marks the one thing to do; neutrals carry the rest. Everything on this page is rendered from <code>tokens.json</code>.</p>';
    h+='<div class="home">'+DATA.groups.map(function(g){var n=DATA.cards.filter(function(c){return c.group===g}).length;if(!n)return"";var f=DATA.cards.find(function(c){return c.group===g});return '<a class="tile" href="#'+f.name+'"><b>'+g+'</b><span>'+n+' card'+(n>1?"s":"")+'</span></a>'}).join("")+'</div>';
    h+='<h1 style="font-size:20px;margin:24px 0 10px">Recent changes</h1><div class="log">'+LOG.entries.map(function(e){return '<div><b>'+e.title+'</b> <span style="display:inline;margin-left:8px">'+e.date+'</span><span>'+e.detail+'</span></div>'}).join("")+'</div>';
  } else {
    var c=DATA.cards.find(function(x){return x.name===hash});
    if(!c){h='<h1>Not found</h1>'} else {
      var sibs=DATA.cards.filter(function(x){return x.group===c.group});
      h='<h1>'+c.group+'</h1><p class="sub">'+sibs.length+' card'+(sibs.length>1?"s":"")+' in this group.</p>'+sibs.map(card).join("");
      setTimeout(function(){var el=document.getElementById("c-"+hash);if(el)el.scrollIntoView()},50);
    }
  }
  m.innerHTML=h;
}
window.addEventListener("hashchange",route);
$("#q").addEventListener("input",nav);
</script></body></html>
