<!-- @dsCard group="Navigation" height=816 width=900 subtitle="Search, filter chips, count and clear on an All stores list: default, filtered, and no match" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>DirectoryFilters</title><link rel="stylesheet" href="../bundle.css"><script src="../icons.js"></script><script src="../kit.js" defer></script>
<style>
.f{width:390px;font-family:var(--font-native)}
.sb{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;margin-bottom:12px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface);font:400 16px/22px var(--font-native);color:var(--muted)}
.chips{display:flex;gap:8px;padding-bottom:12px}
.chip{height:36px;display:grid;place-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);font:600 14px/18px var(--font-native)}
.chip.on{background:var(--selected);color:var(--on-selected);border-color:var(--selected)}
.cnt{display:flex;justify-content:space-between;margin-bottom:12px;font:400 14px/18px var(--font-native);color:var(--muted)}
.cnt a{font-weight:700;color:var(--primary-text)}
.item{height:72px;border-radius:16px;background:var(--surface);border:1px solid var(--hairline);margin-bottom:10px}
.none{padding:28px 16px;text-align:center;border-radius:16px;border:1px solid var(--hairline);background:var(--surface)}.none b{display:block;font:600 17px/24px var(--font-native)}
</style></head>
<body><div class="cz-page"><div class="cz-grid">
  <div class="cz-col f"><div class="sb">Search stores</div><div class="chips"><div class="chip on">All</div><div class="chip">Open now</div><div class="chip">Delivers</div></div><div class="cnt"><span>24 stores</span></div><div class="item"></div><div class="item"></div>
    <p class="cz-cap">Default.</p></div>
  <div class="cz-col f"><div class="sb">harvest</div><div class="chips"><div class="chip">All</div><div class="chip on">Open now</div><div class="chip">Delivers</div></div><div class="cnt"><span>2 stores</span><a>Clear</a></div><div class="item"></div>
    <p class="cz-cap">Searching with a filter on.</p></div>
  <div class="cz-col f"><div class="sb">sushi</div><div class="chips"><div class="chip on">All</div></div><div class="cnt"><span>0 stores</span><a>Clear</a></div><div class="none"><b>No stores match</b><span style="color:var(--muted)">Try a different search, city or community.</span></div>
    <p class="cz-cap">No match.</p></div>
</div></div></body></html>
