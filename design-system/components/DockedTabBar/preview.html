<!-- @dsCard group="Navigation" height=724 width=900 subtitle="Bottom tab bar docked to the screen edge and the cart dot: tabs, active, empty cart and cart with items" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>DockedTabBar</title><link rel="stylesheet" href="../bundle.css"><script src="../icons.js"></script><script src="../kit.js" defer></script>
<style>
.ph{position:relative;width:390px;height:420px;border-radius:32px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 8px var(--ink),var(--shadow-lg);font-family:var(--font-native)}
.ph .body{padding:56px 16px;display:grid;gap:10px}.ph .body i{display:block;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--hairline)}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;padding:8px 0 28px;background:var(--surface);border-top:1px solid var(--hairline)}
.tab{flex:1;display:grid;justify-items:center;gap:2px;min-height:48px;font:600 12px/16px var(--font-native);color:var(--muted)}
.tab.on{color:var(--primary)}.tab .g{width:24px;height:24px;border-radius:8px;background:currentColor;opacity:.85}
.cartrow{display:flex;gap:24px;align-items:center;font:500 14px/18px var(--font-native)}
.cb{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--hairline)}
.cb .g{width:22px;height:22px;border-radius:6px;background:var(--ink);opacity:.8}.cb .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
</style></head>
<body><div class="cz-page"><div class="cz-grid">
  <div class="cz-col"><div class="ph"><div class="body"><i></i><i></i><i></i><i></i></div><div class="tabs"><div class="tab on"><div class="g"></div>Home</div><div class="tab"><div class="g"></div>Activities</div><div class="tab"><div class="g"></div>Account</div></div></div>
    <p class="cz-cap">Docked to the edge, full width, hairline on top, home indicator area inside the bar.</p></div>
  <div class="cz-col" style="gap:20px"><div class="cartrow"><div class="cb"><div class="g"></div></div>Cart empty</div><div class="cartrow"><div class="cb"><div class="g"></div><div class="dot"></div></div>Cart has items (label: View cart (3))</div>
    <p class="cz-cap">The dot replaces the numeric badge.</p></div>
</div></div></body></html>
